schema_version: 1
kind: policy
tokens:
  system: Which source-system identifier has the team agreed?
  concept: Which business concept does this model represent?
  attribute: Which output attribute name should this source column use?
naming:
- id: staging_file
  target: model_file
  template: models/staging/stg_{system}_{concept}.sql
  scope:
    directory: models/staging
- id: staging_properties
  target: properties_file
  template: models/staging/{concept}.yml
- id: business_columns
  target: column
  template: '{attribute}'
modelling:
- id: staging_design
  style: relational
  normal_form: 3NF
