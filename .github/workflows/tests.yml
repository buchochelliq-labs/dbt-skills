name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.14"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v

  dbt-parse:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -r requirements.txt
      - run: |
          python -m venv /tmp/dbt-validation-env
          /tmp/dbt-validation-env/bin/python -m pip install dbt-core==1.11.7 dbt-duckdb==1.10.0
      - run: |
          python -m unittest discover -s tests -p test_model_validation.py -v
          python -m unittest discover -s tests -p test_column_naming.py -v
        env:
          DBT_SKILLS_REAL_DBT: /tmp/dbt-validation-env/bin/dbt
