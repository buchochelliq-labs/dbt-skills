<!doctype html><html lang="en"><meta charset="utf-8"><title>UOL responsive verification</title><style>body{margin:0;font:12px system-ui;background:#e9ede7}header{height:40px;display:flex;align-items:center;gap:12px;padding:0 12px;white-space:nowrap}iframe{display:block;border:0;background:white;width:1440px;height:960px}select,button{font:inherit;padding:4px}</style><header><label>Viewport <select id="size"><option>1440</option><option>900</option><option>390</option></select></label><button id="fit">Fit preview</button><span>Actual iframe viewport · isolated session · keyboard and responsive QA</span></header><iframe id="app" title="UOL responsive app" src="/"></iframe><script>document.getElementById('size').onchange=e=>{document.getElementById('app').style.width=e.target.value+'px';};document.getElementById("fit").onclick=()=>{const f=document.getElementById("app");f.style.transformOrigin="top left";f.style.transform=`scale(${Math.min(1,window.innerWidth/parseInt(f.style.width||1440))})`;window.scrollTo(0,0);};</script></html>
